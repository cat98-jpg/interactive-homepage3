<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Portfolio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}
.stage{position:relative;width:100%;max-width:1448px;margin:0 auto;font-family:Georgia,serif}
.desk{width:100%;height:auto;display:block}
.overlay{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.hotspot{fill:transparent;stroke:transparent;stroke-width:3;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s,stroke .15s,filter .15s}
.hotspot:hover,.hotspot.active,.hotspot:focus{fill:rgba(255,200,85,.14);stroke:#ffdc86;filter:drop-shadow(0 0 7px #f8bf59);outline:none}
.popup{position:absolute;z-index:5;min-width:130px;max-width:250px;padding:10px 16px;text-align:center;line-height:1.25;color:#fbe9c5;background:rgba(25,18,12,.96);border:2px solid #e7bb61;border-radius:9px;box-shadow:0 0 12px #7d542b,0 8px 25px #0007;pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-100%) translateY(-8px);transition:opacity .15s,transform .15s,visibility .15s}
.popup.show{opacity:1;visibility:visible;transform:translate(-50%,-100%)}
.label{font-size:18px;white-space:nowrap}
.portrait{width:245px;max-width:32%}.portrait img{display:block;width:100%;max-height:260px;object-fit:cover;margin-top:9px;border:1px solid #e7bb61}
#clockTime{font-size:25px;margin-top:6px}#clockDate{font-size:12px;margin-top:3px}
@media(max-width:700px){.popup{padding:6px 8px;min-width:95px}.label{font-size:13px}.portrait{width:160px;max-width:35%}.portrait img{max-height:165px}#clockTime{font-size:17px}}
</style></head><body>
<div class="stage">
<img class="desk" src="desk.png" width="1448" height="1086" alt="Illustrated interactive desk">
<!-- Exact mapping coordinates from the supplied Image-Map.net code. -->
<svg class="overlay" viewBox="0 0 1448 1086" preserveAspectRatio="none">
<circle class="hotspot" tabindex="0" data-key="clock" cx="939" cy="573" r="28"/>
<a href="https://sites.google.com/students.uwf.edu/trieskeyeportfolio/inquiry-essay?authuser=0" target="_blank" rel="noopener noreferrer"><polygon class="hotspot" data-key="inquiry" points="631,744 796,742 810,945 610,943"/></a>
<a href="https://sites.google.com/students.uwf.edu/trieskeyeportfolio/micro-memoir?authuser=0" target="_blank" rel="noopener noreferrer"><polygon class="hotspot" data-key="micro" points="817,666 827,818 980,822 948,666"/></a>
<a href="https://sites.google.com/students.uwf.edu/trieskeyeportfolio/reflections?authuser=0" target="_blank" rel="noopener noreferrer"><polygon class="hotspot" data-key="reflections" points="176,698 68,896 307,896 373,696"/></a>
<polygon class="hotspot" tabindex="0" data-key="future1" points="468,607 485,611 504,600 523,600 553,596 589,594 612,588 677,723 618,731 572,738 538,746 521,753 502,759 460,615"/>
<polygon class="hotspot" tabindex="0" data-key="author" points="1161,550 1265,571 1227,691 1172,653 1157,660 1132,653"/>
<a href="https://sites.google.com/students.uwf.edu/trieskeyeportfolio/artifact-2?authuser=0" target="_blank" rel="noopener noreferrer"><polygon class="hotspot" data-key="artifact1" points="1087,721 1261,841 1345,776 1172,655"/></a>
<a href="https://sites.google.com/students.uwf.edu/trieskeyeportfolio/artifact-3?authuser=0" target="_blank" rel="noopener noreferrer"><polygon class="hotspot" data-key="artifact2" points="1051,714 1146,660 1159,666 1089,719 1263,848 1349,778 1375,803 1269,896 1047,740"/></a>
<polygon class="hotspot" tabindex="0" data-key="future2" points="1364,827 1358,852 1242,951 1020,778 1035,731 1087,774 1267,903"/>
</svg>
<div class="popup" id="pop-clock" style="left:64.84807%;top:47.88214%"><div class="label">Current Time</div><div id="clockTime"></div><div id="clockDate"></div></div>
<div class="popup" id="pop-inquiry" style="left:49.03315%;top:66.66667%"><div class="label">Inquiry Essay</div></div>
<div class="popup" id="pop-micro" style="left:61.94751%;top:59.39227%"><div class="label">Micro Memoir</div></div>
<div class="popup" id="pop-reflections" style="left:14.15746%;top:62.24678%"><div class="label">Reflections</div></div>
<div class="popup" id="pop-future1" style="left:38.32873%;top:52.30203%"><div class="label">Coming Soon</div></div>
<div class="popup portrait" id="pop-author" style="left:82.87293%;top:48.06630%"><div class="label">The Author</div><img src="author.jpg" alt="Author portrait"></div>
<div class="popup" id="pop-artifact1" style="left:82.52762%;top:58.19521%"><div class="label">Artifact 2</div></div>
<div class="popup" id="pop-artifact2" style="left:85.29006%;top:59.85267%"><div class="label">Artifact 3</div></div>
<div class="popup" id="pop-future2" style="left:80.45580%;top:65.65378%"><div class="label">Coming Soon</div></div>
</div>
<script>
function closePopups(){document.querySelectorAll('.popup').forEach(e=>e.classList.remove('show'));document.querySelectorAll('.hotspot').forEach(e=>e.classList.remove('active'))}
document.querySelectorAll('.hotspot').forEach(h=>{
 const p=document.getElementById('pop-'+h.dataset.key);
 const show=()=>{closePopups();p.classList.add('show');h.classList.add('active')};
 h.addEventListener('pointerenter',show);
 h.addEventListener('pointerleave',closePopups);
 h.addEventListener('focus',show);
 h.addEventListener('blur',closePopups);
});
function updateClock(){
 const n=new Date();
 document.getElementById('clockTime').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
 document.getElementById('clockDate').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
updateClock();setInterval(updateClock,1000);
</script></body></html>
